<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Benjamin Akinade portfolio preview</title>
  <desc id="desc">A premium portfolio preview card with teal and navy theme.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1f2e"/>
      <stop offset="55%" stop-color="#0d5c63"/>
      <stop offset="100%" stop-color="#7fd8ce"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1180" cy="90" r="190" fill="#7fd8ce" opacity="0.10"/>
  <circle cx="180" cy="580" r="220" fill="#38bdf8" opacity="0.08"/>

  <rect x="90" y="80" width="1020" height="470" rx="28" fill="url(#card)" stroke="rgba(255,255,255,0.2)"/>

  <g>
    <text x="120" y="180" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4" fill="#7fd8ce">TECH + CREATIVE PROFESSIONAL</text>
    <text x="120" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="800" fill="#ffffff">Benjamin Akinade</text>
    <text x="120" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#d9f6f3">Frontend Developer • Social Strategist • Framer Designer</text>
    <rect x="120" y="365" width="260" height="56" rx="14" fill="#7fd8ce"/>
    <text x="150" y="402" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#0b1f2e">View Portfolio</text>
  </g>

  <g>
    <rect x="760" y="170" width="250" height="250" rx="32" fill="#0d5c63" opacity="0.62"/>
    <circle cx="885" cy="292" r="90" fill="#f6fbfb" opacity="0.16"/>
    <path d="M873 220c-50 0-90 39-90 89 0 52 41 94 90 94 54 0 94-44 94-94 0-50-40-89-94-89zm0 212c-34 0-62-27-62-62 0-35 28-63 62-63 33 0 61 28 61 63 0 35-28 62-61 62z" fill="#ffffff" opacity="0.75"/>
    <path d="M868 258l28 34 47-61" fill="none" stroke="#7fd8ce" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
